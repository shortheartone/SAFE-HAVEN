# ============================================================
#  SAFE-HAVEN — Local Development Environment
#  Spins up a Stellar standalone node + frontend dev server
#  with the contract auto-deployed and VITE_CONTRACT_ID injected.
#
#  Usage:
#    docker compose up -d           # start everything
#    docker compose logs -f setup   # watch contract deployment
#    docker compose down            # tear down
# ============================================================

services:
  # ── Stellar standalone node (Soroban RPC + Horizon) ────────
  stellar:
    image: stellar/quickstart:latest
    platform: linux/amd64
    container_name: safe-haven-stellar
    ports:
      - "8000:8000"   # Soroban RPC
    command:
      - --standalone
      - --enable-soroban-rpc
      - --enable-horizon
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    networks:
      - safe-haven-net

  # ── Contract build & deploy (one-shot) ─────────────────────
  setup:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: safe-haven-setup
    depends_on:
      stellar:
        condition: service_healthy
    environment:
      STELLAR_RPC_URL: "http://stellar:8000"
      STELLAR_NETWORK: "local"
      STELLAR_NETWORK_PASSPHRASE: "Standalone Network ; February 2017"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -euo pipefail

        echo "==> Configuring Stellar CLI for local network..."
        stellar network add local \
          --rpc-url "$$STELLAR_RPC_URL" \
          --network-passphrase "$$STELLAR_NETWORK_PASSPHRASE" \
          2>/dev/null || true

        echo "==> Generating funded identity..."
        stellar keys generate deployer \
          --network local

        stellar keys fund deployer \
          --network local \
          --rpc-url "$$STELLAR_RPC_URL" \
          || stellar keys generate deployer --network local --fund

        ADMIN_ADDR=$$(stellar keys address deployer)
        echo "    Admin: $$ADMIN_ADDR"

        echo "==> Deploying contract..."
        CONTRACT_ID=$$(stellar contract deploy \
          --wasm target/wasm32-unknown-unknown/release/safe_haven.wasm \
          --source deployer \
          --network local)

        echo "    Contract ID: $$CONTRACT_ID"

        echo "==> Initializing contract..."
        stellar contract invoke \
          --id "$$CONTRACT_ID" \
          --source deployer \
          --network local \
          -- initialize \
          --admin "$$ADMIN_ADDR"

        echo "    Initialized."

        echo "==> Writing frontend/.env..."
        mkdir -p /app/frontend
        cat > /app/frontend/.env <<ENVEOF
VITE_CONTRACT_ID=$$CONTRACT_ID
VITE_NETWORK_PASSPHRASE=$$STELLAR_NETWORK_PASSPHRASE
VITE_RPC_URL=http://localhost:8000
VITE_HORIZON_URL=http://localhost:8000
VITE_EXPLORER_URL=
ENVEOF

        echo "    Contract ID written to frontend/.env"
        echo ""
        echo "============================================"
        echo "  Local dev environment ready!"
        echo "  Contract ID: $$CONTRACT_ID"
        echo "  Frontend:    http://localhost:5173"
        echo "============================================"

        # Keep the .env file accessible to the host via volume
    volumes:
      - frontend_env:/app/frontend
    networks:
      - safe-haven-net

  # ── Frontend dev server ────────────────────────────────────
  frontend:
    image: node:20-slim
    container_name: safe-haven-frontend
    working_dir: /app
    depends_on:
      setup:
        condition: service_completed_successfully
    ports:
      - "5173:5173"
    environment:
      VITE_CONTRACT_ID: "${VITE_CONTRACT_ID:-}"
      VITE_NETWORK_PASSPHRASE: "Standalone Network ; February 2017"
      VITE_RPC_URL: "http://localhost:8000"
      VITE_HORIZON_URL: "http://localhost:8000"
      VITE_EXPLORER_URL: ""
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - frontend_env:/env:ro
    command:
      - sh
      - -c
      - |
        # If .env was generated by setup, copy it in
        if [ -f /env/.env ]; then
          cp /env/.env /app/.env
          echo "[frontend] Loaded contract ID from setup: $$(grep VITE_CONTRACT_ID /app/.env)"
        fi

        npm install
        npx vite --host 0.0.0.0
    networks:
      - safe-haven-net

volumes:
  frontend_env:

networks:
  safe-haven-net:
    driver: bridge
